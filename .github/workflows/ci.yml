name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "${{ github.event_name == 'push' && 'candidate-head' || 'tested-merge' }} / linux / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python files
        run: >-
          python -m compileall -q
          skills/research-vault
          skills/research-capture
          skills/research-analysis
          skills/research-workbench
          skills/research-review
          runtime/lib/research/__init__.py
          runtime/lib/research/legacy_detector.py
          runtime/lib/research/updater.py
          runtime/lib/research/v2_bootstrap.py
          tools/skill_validator.py
          tools/generate_skill_metadata.py
          tools/check_rule_tokens.py
          tests
          install-lib/ws_sync.py
      - name: Validate installer scripts
        run: |
          bash -n install.sh
          python -m py_compile install-lib/ws_sync.py
      - name: Validate skill metadata
        run: |
          python tools/skill_validator.py skills
          python tools/generate_skill_metadata.py --check
          python tools/check_rule_tokens.py
      - name: Run v2 owner and release suite
        run: env -u CI python -m pytest tests/owners tests/release -q

  macos-release-gate:
    name: "${{ github.event_name == 'push' && 'candidate-head' || 'tested-merge' }} / macos / py${{ matrix.python-version }}"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate scripts and metadata
        run: |
          bash -n install.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q \
            skills/research-vault \
            skills/research-capture \
            skills/research-analysis \
            skills/research-workbench \
            skills/research-review \
            runtime/lib/research/__init__.py \
            runtime/lib/research/legacy_detector.py \
            runtime/lib/research/updater.py \
            runtime/lib/research/v2_bootstrap.py \
            tools/skill_validator.py \
            tools/generate_skill_metadata.py \
            tools/check_rule_tokens.py \
            tests \
            install-lib/ws_sync.py
          python tools/skill_validator.py skills
          python tools/generate_skill_metadata.py --check
          python tools/check_rule_tokens.py
      - name: Run macOS v2 release gate
        run: env -u CI python -m pytest tests/owners tests/release -q
