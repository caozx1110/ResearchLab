name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall .agents/skills .agents/lib tests
      - name: Validate installer scripts
        run: |
          bash -n install.sh
          python -m py_compile install-lib/ws_sync.py
      - name: Validate skill metadata
        run: |
          python .agents/lib/research/skill_validator.py .agents/skills
          python tools/check_rule_tokens.py
      - name: Configure git identity for checkpoint tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Run conversational release gate
        run: python -m pytest tests/test_r1_conversational_release.py -q
      - name: Run tests
        # Unset CI for this step only: the installer PTY tests drive a simulated
        # interactive terminal, and install.sh's is_interactive_input() correctly
        # refuses to prompt when $CI is set (a real-CI safety guard we keep intact).
        run: env -u CI python -m pytest tests -q

  macos-release-gate:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate scripts and metadata
        run: |
          bash -n install.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q .agents/skills .agents/lib tests install-lib/ws_sync.py
          python .agents/lib/research/skill_validator.py .agents/skills
          python tools/check_rule_tokens.py
      - name: Configure git identity for installer and recovery tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Run macOS release and installer smoke tests
        run: |
          env -u CI python -m pytest \
            tests/test_r1_conversational_release.py \
            tests/test_bootstrap.py \
            tests/test_updater.py \
            tests/test_installer.py \
            tests/test_bundle_lifecycle.py \
            -q
