schema: research-skill-metadata/v1
skills:
  research-analysis:
    interface:
      display_name: Research Analysis
      short_description: Evidence-bound Markdown analysis and synthesis
      default_prompt: Use $research-analysis to author and verify Markdown-first claims and multi-source synthesis with exact evidence bindings.
  research-capture:
    interface:
      display_name: Research Capture
      short_description: Capture immutable source revisions and honest readers
      default_prompt: Use $research-capture to save exact source bytes, build safe readers and source maps, and report readiness and degradation honestly.
  research-review:
    interface:
      display_name: Research Review
      short_description: Audit evidence and apply human review decisions safely
      default_prompt: Use $research-review to audit a Markdown claim and its exact evidence, prepare a review packet, or apply an explicitly authorized human decision with a digest-bound receipt.
  research-vault:
    interface:
      display_name: Research Vault
      short_description: Maintain Markdown-first vault layout and recovery
      default_prompt: Use $research-vault to initialize, inspect, index, or safely recover a Markdown-first research vault.
  research-workbench:
    interface:
      display_name: Research Workbench
      short_description: Manage Markdown projects, experiments, decisions, and reports
      default_prompt: Use $research-workbench to maintain visible Markdown lifecycle pages, keep facts separate from interpretations, and preserve user edits across derived-view rebuilds.
